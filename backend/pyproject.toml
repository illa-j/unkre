[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "illa-j", email = "iliacdmn@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiogram[fast]>=3.31.0",
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "arq>=0.28.0",
    "asyncpg>=0.32.0",
    "fastapi-guard>=8.1.2",
    "fastapi[standard]>=0.162.0",
    "gunicorn>=26.2.0",
    "httpx>=0.28.1",
    "minio>=7.2.20",
    "psycopg2-binary>=2.9.13",
    "pydantic-settings>=2.16.2",
    "pyjwt[crypto]>=2.15.1",
    "redis>=5.3.1",
    "ruff>=0.17.3",
    "sqlalchemy[asyncio]>=2.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "pytest-asyncio>=1.4.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
target-version = "py314"
line-length = 88
exclude = ["adapters/database/migrations/versions"]

[tool.ruff.lint]
# Deliberately narrow: this codebase is written with Ukrainian comments and
# docstrings, so RUF001/002/003 (ambiguous unicode) and E501 would report
# hundreds of findings that are pure noise. The selected set is the subset that
# is green today and still catches real mistakes (dead imports, wrong
# annotations, unused variables, shadowing) plus consistent import ordering.
select = ["F", "E4", "E7", "E9", "UP", "I"]

[tool.ruff.lint.isort]
known-first-party = ["adapters", "domain", "ports", "tests"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
