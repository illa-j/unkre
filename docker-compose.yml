name: unkre

x-container-logging: &container-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-backend-env: &backend-env
  POSTGRES_HOST: db
  REDIS_URL: redis://redis:6379/0
  PYTHONPATH: /app/src
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-unkre}
  MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-unkre-minio-dev-secret}
  MINIO_BUCKET: ${MINIO_BUCKET:-unkre-images}
  MINIO_RETENTION_HOURS: ${MINIO_RETENTION_HOURS:-24}

services:
  db:
    logging: *container-logging
    image: postgres:16-alpine
    container_name: unkre-db
    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    env_file:
      - path: backend/.env
        required: false
    command:
      - postgres
      - -c
      - log_statement=none
      - -c
      - log_min_error_statement=panic
      - -c
      - log_error_verbosity=terse
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks:
      - unkre

  redis:
    logging: *container-logging
    image: redis:7-alpine
    container_name: unkre-redis
    ports:
      - "${REDIS_BIND_ADDRESS:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    networks:
      - unkre

  minio:
    logging: *container-logging
    image: ${MINIO_IMAGE:-cgr.dev/chainguard/minio:latest}
    container_name: unkre-minio
    command: ["server", "/data", "--console-address", ":9001"]
    # The Chainguard build runs as uid 65532; root keeps a fresh named volume writable.
    user: "0:0"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-unkre}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-unkre-minio-dev-secret}
    volumes:
      - minio-data:/data
    restart: unless-stopped
    networks:
      - unkre

  migrator:
    logging: *container-logging
    build:
      context: ./backend
    image: unkre-backend:latest
    container_name: unkre-migrator
    command: ["alembic", "-c", "src/adapters/database/alembic.ini", "upgrade", "head"]
    env_file:
      - path: backend/.env
        required: false
    environment:
      <<: *backend-env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks:
      - unkre

  seed:
    logging: *container-logging
    build:
      context: ./backend
    image: unkre-backend:latest
    container_name: unkre-seed
    command: ["python", "scripts/seed_catalog.py"]
    env_file:
      - path: backend/.env
        required: false
    environment:
      <<: *backend-env
    volumes:
      - ./backend/scripts:/app/scripts:ro
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    profiles: ["tools"]
    networks:
      - unkre

  web:
    logging: *container-logging
    build:
      context: ./backend
    image: unkre-backend:latest
    container_name: unkre-web
    command:
      - sh
      - -c
      - exec uvicorn adapters.api.main:app --host 0.0.0.0 --port 8000 --workers ${API_WORKERS:-2}
    env_file:
      - path: backend/.env
        required: false
    environment:
      <<: *backend-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      migrator:
        condition: service_completed_successfully
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped
    networks:
      - unkre

  worker:
    logging: *container-logging
    build:
      context: ./backend
    image: unkre-backend:latest
    container_name: unkre-worker
    command: ["arq", "adapters.task_queue.worker.WorkerSettings"]
    env_file:
      - path: backend/.env
        required: false
    environment:
      <<: *backend-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      migrator:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - unkre

  bot:
    logging: *container-logging
    build:
      context: ./backend
    image: unkre-backend:latest
    container_name: unkre-bot
    command: ["python", "-m", "adapters.bot.main"]
    env_file:
      - path: backend/.env
        required: false
    environment:
      <<: *backend-env
    depends_on:
      migrator:
        condition: service_completed_successfully
    restart: on-failure
    networks:
      - unkre

  frontend:
    logging: *container-logging
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
        NEXT_PUBLIC_WELCOME_CREDITS: ${NEXT_PUBLIC_WELCOME_CREDITS:-15}
        NEXT_PUBLIC_SUPPORT_EMAIL: ${NEXT_PUBLIC_SUPPORT_EMAIL:-}
        NEXT_PUBLIC_PRIVACY_URL: ${NEXT_PUBLIC_PRIVACY_URL:-}
        NEXT_PUBLIC_TERMS_URL: ${NEXT_PUBLIC_TERMS_URL:-}
        NEXT_PUBLIC_TELEGRAM_BOT_URL: ${NEXT_PUBLIC_TELEGRAM_BOT_URL:-}
        NEXT_PUBLIC_CSRF_HEADER_NAME: ${NEXT_PUBLIC_CSRF_HEADER_NAME:-X-CSRF-Token}
        SITE_INDEXABLE: ${SITE_INDEXABLE:-true}
    image: unkre-frontend:latest
    container_name: unkre-frontend
    environment:
      BACKEND_URL: http://web:8000
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      web:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped
    networks:
      - unkre

  nginx:
    logging: *container-logging
    build:
      context: ./nginx
    image: unkre-nginx:latest
    container_name: unkre-nginx
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${ADMIN_BIND_ADDRESS:-127.0.0.1}:${ADMIN_HTTP_PORT:-18081}:81"
    depends_on:
      web:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - unkre

volumes:
  postgres-data:
    driver: local
  minio-data:
    driver: local

networks:
  unkre:
    driver: bridge
