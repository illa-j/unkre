# Reverse proxy for NoCensGen: Next.js + FastAPI in the Compose network.
worker_processes 1;
pid /data/data/com.termux/files/usr/var/run/nginx-nocensgen.pid;
daemon off;

events {
    worker_connections 2048;
}

http {
    include       /data/data/com.termux/files/usr/etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;

    # Docker's embedded DNS. Resolve upstreams per request so recreating the
    # api/frontend containers never leaves nginx pointing at a stale IP.

    # Real client IP behind Cloudflare or a local cloudflared tunnel.
    # The header is trusted only from Cloudflare edge ranges and local/private
    # proxies; direct public requests keep their socket address.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      "";
    }

    # Preserve the public scheme when Cloudflare/cloudflared terminates TLS.
    # Only recognized values are accepted; everything else falls back to $scheme.
    map $http_x_forwarded_proto $forwarded_proto {
        default       $scheme;
        "~*^https$"   https;
        "~*^http$"    http;
    }

    # nginx is the cheap first line of defence. FastAPI still enforces its own
    # per-route limits; these buckets mirror the backend's expensive routes.
    limit_req_zone $binary_remote_addr zone=api_auth:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api_refresh:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=api_payments:10m rate=120r/m;
    limit_req_zone $binary_remote_addr zone=api_webhook:10m rate=120r/m;
    limit_req_zone $binary_remote_addr zone=api_generation:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=180r/m;
    limit_req_zone $binary_remote_addr zone=web_pages:10m rate=600r/m;
    limit_req_zone $binary_remote_addr zone=web_assets:10m rate=2400r/m;
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
    limit_req_status 429;
    limit_req_log_level warn;

    # Common proxy defaults. Keep these at http level: a location-level
    # proxy_set_header replaces the whole inherited set.
    client_body_temp_path /data/data/com.termux/files/usr/var/lib/nginx/client_body;
    proxy_temp_path /data/data/com.termux/files/usr/var/lib/nginx/proxy;
    fastcgi_temp_path /data/data/com.termux/files/usr/var/lib/nginx/fastcgi;
    uwsgi_temp_path /data/data/com.termux/files/usr/var/lib/nginx/uwsgi;
    scgi_temp_path /data/data/com.termux/files/usr/var/lib/nginx/scgi;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_hide_header X-Powered-By;
    proxy_hide_header X-Request-ID;
    # nginx owns the edge security headers; avoid duplicate values from
    # Next.js or fastapi-guard.
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header Cross-Origin-Opener-Policy;

    # Prompts, cookies and payment postbacks should not be buffered to disk.
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    proxy_max_temp_file_size 0;

    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    client_max_body_size 8m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        image/svg+xml font/ttf font/otf font/woff font/woff2;

    log_format observability escape=json
        '{"timestamp":"$time_iso8601","level":"info","service":"nginx",'
        '"event":"http_request","request_id":"$request_id",'
        '"method":"$request_method","uri":"$request_uri",'
        '"status":$status,"duration_seconds":$request_time,'
        '"upstream_status":"$upstream_status",'
        '"limit_req":"$limit_req_status","limit_conn":"$limit_conn_status"}';
    access_log /data/data/com.termux/files/usr/var/log/nginx/nginx-nocensgen-access.log observability;
    error_log /data/data/com.termux/files/usr/var/log/nginx/nginx-nocensgen-error.log warn;

    # Public entrypoint. The API is exposed under /api and stripped before it
    # reaches FastAPI, so the browser and the API share one origin.
    server {
        listen 18082 default_server;
        server_name _;

        set $api_backend http://127.0.0.1:8001;
        set $frontend_backend http://127.0.0.1:3001;

        add_header X-Request-ID $request_id always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        error_page 429 = @rate_limited;
        error_page 404 /404.html;

        location = /404.html {
            internal;
            root /data/data/com.termux/files/usr/share/nginx/html/nocensgen;
            default_type text/html;
        }

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /api {
            return 308 /api/;
        }

        # Admin API, console and API docs are not public. The console is
        # available only through the local admin entrypoint on port 81.
        location ^~ /admin {
            return 404;
        }
        location ^~ /api/admins {
            return 404;
        }
        # Defensive: block the singular spelling too, in case an old client or
        # future route is added under /api/admin.
        location ^~ /api/admin {
            return 404;
        }
        location = /api/openapi.json { return 404; }
        location ^~ /api/docs { return 404; }
        location ^~ /api/redoc { return 404; }

        # Payment provider callbacks. Keep this before the payments bucket.
        location ^~ /api/payments/webhooks/ {
            limit_req zone=api_webhook burst=30 nodelay;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass $api_backend;
        }

        location = /api/users/auth/refresh {
            limit_req zone=api_refresh burst=10 nodelay;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass $api_backend;
        }

        location ^~ /api/users/auth/ {
            limit_req zone=api_auth burst=5 nodelay;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass $api_backend;
        }

        location ^~ /api/payments {
            limit_req zone=api_payments burst=20 nodelay;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass $api_backend;
        }

        location ^~ /api/generations {
            limit_req zone=api_generation burst=20 nodelay;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass $api_backend;
        }

        location ^~ /api/ {
            limit_req zone=api_general burst=60 nodelay;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass $api_backend;
        }

        location ^~ /_next/static/ {
            limit_req zone=web_assets burst=300 nodelay;
            limit_conn conn_per_ip 50;
            proxy_pass $frontend_backend;
        }

        location ^~ /_next/image {
            limit_req zone=web_assets burst=300 nodelay;
            proxy_pass $frontend_backend;
        }

        location ~* ^/(SFW|NSFW|payment)/ {
            limit_req zone=web_assets burst=300 nodelay;
            proxy_pass $frontend_backend;
        }

        location ~ ^/(favicon\.ico|robots\.txt|sitemap\.xml|opengraph-image|twitter-image)$ {
            limit_req zone=web_assets burst=100 nodelay;
            proxy_pass $frontend_backend;
        }

        # Next.js HMR (dev-only, harmless in production).
        location ~ ^/_next/(webpack-)?hmr$ {
            limit_req zone=web_pages burst=100 nodelay;
            proxy_pass $frontend_backend;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location / {
            limit_req zone=web_pages burst=100 nodelay;
            limit_conn conn_per_ip 40;
            proxy_pass $frontend_backend;
        }

        location @rate_limited {
            default_type application/json;
            add_header Retry-After 60 always;
            add_header Cache-Control "no-store" always;
            add_header X-Request-ID $request_id always;
            return 429 '{"detail":"Too many requests; please try again later"}';
        }
    }

    # Local-only admin entrypoint, published as 127.0.0.1:${ADMIN_HTTP_PORT}.
    # The public server blocks /api/admins; this one exposes it to the host only.
    server {
        listen 18083;
        server_name _;

        set $api_backend http://127.0.0.1:8001;
        set $frontend_backend http://127.0.0.1:3001;

        add_header X-Request-ID $request_id always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        error_page 429 = @rate_limited;
        error_page 404 /404.html;

        location = /404.html {
            internal;
            root /data/data/com.termux/files/usr/share/nginx/html/nocensgen;
            default_type text/html;
        }

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # The local entrypoint opens the admin console directly.
        location = / {
            return 302 $scheme://$http_host/admin;
        }

        location = /api {
            return 308 /api/;
        }

        # Swagger is available only on the local admin entrypoint.
        location = /openapi.json {
            proxy_pass $api_backend;
        }
        location ^~ /docs {
            proxy_pass $api_backend;
        }
        location ^~ /redoc {
            proxy_pass $api_backend;
        }

        location ^~ /api/ {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass $api_backend;
        }

        # Direct backend routes for Swagger "Try it out" on the admin entrypoint.
        location ~ ^/(admins|users|generations|payments|healthz)(/|$) {
            proxy_pass $api_backend;
        }

        location ^~ /_next/static/ {
            proxy_pass $frontend_backend;
        }

        location ^~ /_next/image {
            proxy_pass $frontend_backend;
        }

        location ~* ^/(SFW|NSFW|payment)/ {
            proxy_pass $frontend_backend;
        }

        location ~ ^/(favicon\.ico|robots\.txt|sitemap\.xml|opengraph-image|twitter-image)$ {
            proxy_pass $frontend_backend;
        }

        location ~ ^/_next/(webpack-)?hmr$ {
            proxy_pass $frontend_backend;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location / {
            proxy_pass $frontend_backend;
        }

        location @rate_limited {
            default_type application/json;
            add_header Retry-After 60 always;
            add_header Cache-Control "no-store" always;
            add_header X-Request-ID $request_id always;
            return 429 '{"detail":"Too many requests; please try again later"}';
        }
    }
}
