<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Page not found — NoCensGen</title>
  <style>
    :root {
      color-scheme: dark;
      --canvas: #13191b;
      --surface: #20282b;
      --ink: #f0f4f3;
      --soft: #a0afb0;
      --muted: #758588;
      --line: #354447;
      --accent: #84b8b1;
      --accent-soft: #d5e8e3;
      --accent-surface: #253b3b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 20px;
      background: var(--canvas);
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main {
      display: grid;
      grid-template-columns: minmax(0, 620px) minmax(220px, 1fr);
      align-items: center;
      gap: 48px;
      width: min(1080px, 100%);
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--ink);
      font-size: 30px;
      font-weight: 600;
      letter-spacing: -0.04em;
      text-decoration: none;
    }
    .brand img {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: block;
    }
    .brand span { color: var(--accent); }
    .eyebrow {
      margin: 56px 0 0;
      color: var(--accent);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    h1 {
      margin: 16px 0 0;
      font-size: clamp(48px, 6vw, 88px);
      font-weight: 600;
      line-height: 1;
      letter-spacing: -0.04em;
    }
    p {
      max-width: 500px;
      margin: 24px 0 0;
      color: var(--soft);
      font-size: 15px;
      line-height: 1.8;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 28px;
    }
    .actions a {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      padding: 11px 18px;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--soft);
      font-size: 13px;
      font-weight: 500;
      text-decoration: none;
      transition: 150ms ease;
    }
    .actions a:first-child {
      border-color: var(--accent);
      background: var(--accent);
      color: var(--canvas);
      font-weight: 600;
    }
    .actions a:hover { border-color: var(--accent); color: var(--ink); }
    .actions a:first-child:hover { background: #9accc5; color: var(--canvas); }
    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 22px;
      margin-top: 40px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
    }
    .links a {
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 10px;
      letter-spacing: 0.1em;
      text-decoration: none;
      text-transform: uppercase;
    }
    .links a:hover { color: var(--accent); }
    .code {
      display: grid;
      place-items: center;
      min-height: 320px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--surface);
    }
    .code span {
      color: var(--accent-soft);
      font-size: clamp(140px, 18vw, 240px);
      font-weight: 600;
      line-height: 0.8;
      letter-spacing: -0.08em;
    }
    @media (max-width: 760px) {
      main { grid-template-columns: 1fr; gap: 20px; }
      .code { min-height: 0; padding: 28px; order: -1; }
      .code span { font-size: 120px; }
      .actions a { width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>
  <main>
    <div>
      <a class="brand" href="/" aria-label="NoCensGen home">
        <img src="/brand/icon-192.png" alt="" width="32" height="32">
        NoCens<span>Gen</span>
      </a>
      <p class="eyebrow">404</p>
      <h1>This page isn’t here.</h1>
      <p>The link may be old, misspelled, or the page has moved. The generator is still open, your credits are safe, and the gallery is one click away.</p>
      <div class="actions">
        <a href="/">Back to the generator</a>
        <a href="/gallery">Browse the gallery</a>
      </div>
      <nav class="links" aria-label="Useful links">
        <a href="/pricing">Pricing</a>
        <a href="/how-it-works">How it works</a>
        <a href="/faq">FAQ</a>
        <a href="/gallery">Gallery</a>
        <a href="/contact">Contact</a>
        <a href="/editorial-policy">Editorial policy</a>
        <a href="/privacy">Privacy</a>
        <a href="/terms">Terms</a>
      </nav>
    </div>
    <div class="code" aria-hidden="true"><span>404</span></div>
  </main>
</body>
</html>
