    .actions { display:flex; flex-wrap:wrap; gap:10px; margin-top:28px; }
    .actions a { display:inline-flex; align-items:center; justify-content:space-between; gap:26px; min-height:48px; padding:12px 20px; border:1px solid #ffffff25; border-radius:99px; color:var(--ink); font-size:13px; text-decoration:none; }

    .links { display:flex; flex-wrap:wrap; gap:10px 24px; margin-top:44px; padding-top:20px; border-top:1px solid #ffffff18; }
    .links a { color:#9eafb7; font-size:12px; text-decoration:none; }
    .links a:hover { color:var(--accent); }
    .code { position:relative; display:grid; place-items:center; min-height:360px; }
    .code::before { content:""; position:absolute; width:min(30vw,360px); height:min(30vw,360px); border:1px solid #ddb79d2b; border-radius:50%; }
