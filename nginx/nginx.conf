# Reverse proxy for Unkre: Next.js + FastAPI in the Compose network.
user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;

    # Docker's embedded DNS. Resolve upstreams at request time so recreating
    # the web/frontend containers does not leave nginx with a stale IP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # cloudflared is the public entrypoint. Cloudflare supplies the real client
    # address in CF-Connecting-IP. Trust that header only when the immediate
    # peer is the local tunnel; direct LAN requests keep their socket address.
    map $http_cf_connecting_ip $forwarded_client_ip {
        default $http_cf_connecting_ip;
        ""      $remote_addr;
    }
    map $remote_addr $client_ip {
        default    $remote_addr;
        127.0.0.1  $forwarded_client_ip;
        "::1"      $forwarded_client_ip;
    }

    # Per-IP rate limits. The API also enforces its own per-route budgets;
    # nginx is the cheaper first line of defence and also covers the frontend.
    limit_req_zone $client_ip zone=api_auth:10m rate=10r/m;
    limit_req_zone $client_ip zone=api_refresh:10m rate=60r/m;
    limit_req_zone $client_ip zone=api_payments:10m rate=60r/m;
    limit_req_zone $client_ip zone=api_webhook:10m rate=120r/m;
    limit_req_zone $client_ip zone=api_generation:10m rate=60r/m;
    limit_req_zone $client_ip zone=api_general:10m rate=180r/m;
    limit_req_zone $client_ip zone=web_pages:10m rate=600r/m;
    limit_req_zone $client_ip zone=web_assets:10m rate=2400r/m;
    limit_conn_zone $client_ip zone=conn_per_ip:10m;
    limit_req_status 429;
    limit_req_log_level warn;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $client_ip;
    proxy_set_header X-Forwarded-For $client_ip;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    # Keep all proxy headers at this level: a location-level proxy_set_header
    # would replace the entire inherited set (including Host and forwarded IP).
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_hide_header X-Request-ID;
    proxy_hide_header X-Powered-By;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    # Pass streamed generation responses without proxy buffering or caching.
    proxy_buffering off;
    proxy_request_buffering off;
    client_max_body_size 50m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      "";
    }

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        image/svg+xml font/ttf font/otf font/woff font/woff2;

    log_format main escape=json
        '{"timestamp":"$time_iso8601","service":"nginx",'
        '"request_id":"$request_id","method":"$request_method",'
        '"uri":"$request_uri","status":$status,"duration_seconds":$request_time,'
        '"upstream_status":"$upstream_status"}';
    access_log /dev/stdout main;
    error_log /dev/stderr warn;

    # Shared locations for the public and local-only entrypoints.
    # Admin routes are blocked in the public server block below.
    server {
        listen 80 default_server;
        server_name _;

        set $api_backend http://web:8000;
        set $frontend_backend http://frontend:3000;

        add_header X-Request-ID $request_id always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        error_page 429 = @rate_limited;
        error_page 404 /404.html;

        location = /404.html {
            internal;
            root /usr/share/nginx/html;
            default_type text/html;
        }

        # The admin UI and its API are only reachable on the local entrypoint.
        # These locations must stay before the generic /api/ proxy block.
        location ^~ /admin {
            add_header Cache-Control "no-store" always;
            rewrite ^ /404 break;
            proxy_pass $frontend_backend;
        }
        location ^~ /api/admins {
            add_header Cache-Control "no-store" always;
            return 404;
        }

        # Browsers still probe the legacy path even when the app declares PNG icons.
        location = /favicon.ico {
            rewrite ^ /icon.png break;
            proxy_pass $frontend_backend;
        }

        location = /healthz {
            access_log off;
            limit_req zone=api_general burst=20 nodelay;
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /api {
            return 308 /api/;
        }

        # First-party marketing events are handled by Next.js, not FastAPI.
        location = /api/analytics {
            limit_req zone=api_general burst=20 nodelay;
            client_max_body_size 2k;
            proxy_pass $frontend_backend;
        }

        # API docs stay on the internal/dev entrypoint, not the public origin.
        location = /api/openapi.json { return 404; }
        location ^~ /api/docs { return 404; }
        location ^~ /api/redoc { return 404; }

        # FastAPI lives under /api in the browser and at the root in the app.
        # The most expensive and credential-sensitive routes have their own
        # budgets; everything else falls back to the general API bucket.
        location ^~ /api/payments/webhooks/ {
            limit_req zone=api_webhook burst=30 nodelay;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass $api_backend;
        }

        location = /api/users/auth/refresh {
            limit_req zone=api_refresh burst=10 nodelay;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass $api_backend;
        }

        location ^~ /api/users/auth/ {
            limit_req zone=api_auth burst=5 nodelay;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass $api_backend;
        }

        location ^~ /api/payments {
            limit_req zone=api_payments burst=20 nodelay;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass $api_backend;
        }

        location ^~ /api/generations {
            limit_req zone=api_generation burst=20 nodelay;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass $api_backend;
        }

        location ^~ /api/ {
            limit_req zone=api_general burst=60 nodelay;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass $api_backend;
        }

        location ^~ /_next/static/ {
            limit_req zone=web_assets burst=300 nodelay;
            limit_conn conn_per_ip 50;
            proxy_pass $frontend_backend;
            # Next.js supplies immutable caching for successful hashed assets.
            # Preserve its policy so missing assets are not cached for a year.
        }

        location ^~ /_next/image {
            limit_req zone=web_assets burst=300 nodelay;
            proxy_pass $frontend_backend;
        }

        location ^~ /images/ {
            limit_req zone=web_assets burst=300 nodelay;
            proxy_pass $frontend_backend;
        }

        location ^~ /brand/ {
            limit_req zone=web_assets burst=300 nodelay;
            proxy_pass $frontend_backend;
        }

        location ^~ /og/ {
            limit_req zone=web_assets burst=300 nodelay;
            proxy_pass $frontend_backend;
        }

        # Next.js dev HMR (Turbopack uses /_next/hmr, webpack the old path).
        # A normal GET without Upgrade is valid too, so keep the mapped value.
        location ~ ^/_next/(webpack-)?hmr$ {
            proxy_pass $frontend_backend;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location / {
            limit_req zone=web_pages burst=100 nodelay;
            limit_conn conn_per_ip 40;
            proxy_pass $frontend_backend;
        }

        location @rate_limited {
            default_type application/json;
            add_header Retry-After 60 always;
            add_header Cache-Control "no-store" always;
            return 429 '{"detail":"Too many requests; please try again later"}';
        }
    }

    # Local-only admin entrypoint, published as 127.0.0.1:${ADMIN_HTTP_PORT}.
    server {
        listen 81;
        server_name _;

        set $api_backend http://web:8000;
        set $frontend_backend http://frontend:3000;

        add_header X-Request-ID $request_id always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        error_page 429 = @rate_limited;
        error_page 404 /404.html;

        location = /404.html {
            internal;
            root /usr/share/nginx/html;
            default_type text/html;
        }

        location = /favicon.ico {
            rewrite ^ /icon.png break;
            proxy_pass $frontend_backend;
        }

        location = /healthz {
            access_log off;
            limit_req zone=api_general burst=20 nodelay;
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /api {
            return 308 /api/;
        }

        location = /api/analytics {
            limit_req zone=api_general burst=20 nodelay;
            client_max_body_size 2k;
            proxy_pass $frontend_backend;
        }

        location = /api/openapi.json { return 404; }
        location ^~ /api/docs { return 404; }
        location ^~ /api/redoc { return 404; }

        location ^~ /api/payments/webhooks/ {
            limit_req zone=api_webhook burst=30 nodelay;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass $api_backend;
        }

        location = /api/users/auth/refresh {
            limit_req zone=api_refresh burst=10 nodelay;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass $api_backend;
        }

        location ^~ /api/users/auth/ {
            limit_req zone=api_auth burst=5 nodelay;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass $api_backend;
        }

        location ^~ /api/payments {
            limit_req zone=api_payments burst=20 nodelay;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass $api_backend;
        }

        location ^~ /api/generations {
            limit_req zone=api_generation burst=20 nodelay;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass $api_backend;
        }

        location ^~ /api/ {
            limit_req zone=api_general burst=60 nodelay;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass $api_backend;
        }

        location ^~ /_next/static/ {
            limit_req zone=web_assets burst=300 nodelay;
            limit_conn conn_per_ip 50;
            proxy_pass $frontend_backend;
        }

        location ^~ /_next/image {
            limit_req zone=web_assets burst=300 nodelay;
            proxy_pass $frontend_backend;
        }

        location ^~ /images/ {
            limit_req zone=web_assets burst=300 nodelay;
            proxy_pass $frontend_backend;
        }

        location ^~ /brand/ {
            limit_req zone=web_assets burst=300 nodelay;
            proxy_pass $frontend_backend;
        }

        location ^~ /og/ {
            limit_req zone=web_assets burst=300 nodelay;
            proxy_pass $frontend_backend;
        }

        location ~ ^/_next/(webpack-)?hmr$ {
            proxy_pass $frontend_backend;
